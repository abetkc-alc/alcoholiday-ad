<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI部署 管理ページ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f6f3;
    --card: #ffffff;
    --ink: #222222;
    --ink-soft: #6b6b6b;
    --line: #e2e0db;
    --accent: #c8242b;
    --accent-soft: #fbeaea;
    --ok: #2e7d4f;
    --ok-soft: #e6f3ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    font-size: 17px;
    line-height: 1.7;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 80px; }

  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  header h1 { font-size: 22px; margin: 0; letter-spacing: .02em; }
  header h1 small { display: block; font-size: 13px; color: var(--ink-soft); font-weight: 400; }
  .folder { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; color: var(--ink-soft); }

  button {
    font: inherit; font-size: 15px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: 8px 16px; border-radius: 8px;
  }
  button:hover { border-color: #bdbab3; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  button.primary:hover { filter: brightness(.95); }
  button:disabled { opacity: .45; cursor: not-allowed; }

  .box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 24px; }
  h2 { font-size: 18px; margin: 0 0 14px; }
  label.lbl { display: block; font-weight: 700; margin: 14px 0 6px; }
  label.lbl span { font-weight: 400; color: var(--ink-soft); font-size: 14px; }
  textarea { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; resize: vertical; }
  textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

  .products { display: flex; flex-wrap: wrap; gap: 8px; }
  .products label { cursor: pointer; }
  .products input { position: absolute; opacity: 0; }
  .products span { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; }
  .products i { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,.15); }
  .products input:checked + span { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
  .products input:focus-visible + span { outline: 2px solid var(--accent); }

  .row-end { display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-top: 16px; }
  .msg { font-size: 14px; color: var(--ink-soft); }

  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tabs button.on { background: var(--ink); border-color: var(--ink); color: #fff; }

  .order { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 18px; background: var(--card); }
  .order-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .order-head .pname { font-weight: 700; font-size: 18px; }
  .order-head .oid { color: var(--ink-soft); font-size: 13px; }
  .badge { margin-left: auto; font-size: 13px; padding: 3px 12px; border-radius: 999px; background: #eee; }
  .badge.review, .badge.finish_requested { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .badge.done, .badge.posted { background: var(--ok-soft); color: var(--ok); font-weight: 700; }
  .order-body { padding: 16px 18px; }

  .steps { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 14px; padding: 0; list-style: none; font-size: 13px; }
  .steps li { padding: 2px 10px; border-radius: 4px; background: #f1f0ec; color: #9a978f; }
  .steps li.past { color: var(--ink); }
  .steps li.now { background: var(--ink); color: #fff; font-weight: 700; }

  .brief { white-space: pre-wrap; background: #faf9f6; border-left: 3px solid var(--accent); padding: 8px 12px; border-radius: 4px; }
  details.kayo { margin-top: 12px; font-size: 15px; }
  details.kayo summary { cursor: pointer; color: var(--ink-soft); }
  details.kayo dl { margin: 8px 0 0; }
  details.kayo dt { font-weight: 700; margin-top: 8px; }
  details.kayo dd { margin: 2px 0 0; white-space: pre-wrap; }

  .dept { margin-top: 22px; }
  .dept h3 { font-size: 16px; margin: 0 0 10px; display: flex; align-items: baseline; gap: 8px; }
  .dept h3 small { font-weight: 400; color: var(--ink-soft); font-size: 13px; }
  .empty { color: var(--ink-soft); font-size: 14px; }
  .items { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .items.text { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .item { border: 2px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .item.sel { border-color: var(--accent); background: #fffafa; }
  .item .title { font-weight: 700; font-size: 15px; }
  .item .memo { font-size: 13px; color: var(--ink-soft); white-space: pre-wrap; }
  .items.wide { grid-template-columns: 1fr; }
  .thumbs { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
  .shot { display: flex; flex-direction: column; gap: 4px; border: 2px solid transparent; border-radius: 8px; padding: 3px; }
  .shot.use { border-color: var(--accent); }
  .shot img { width: 100%; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 6px; background: #eee; cursor: zoom-in; }
  .shot .cap { font-size: 12px; color: var(--ink-soft); text-align: center; }
  .shot button { font-size: 13px; padding: 4px 6px; }
  .shot.use button { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .hint { font-size: 13px; color: var(--ink-soft); margin: -4px 0 10px; }
  video { width: 100%; aspect-ratio: 9 / 16; background: #000; border-radius: 6px; }
  .script { white-space: pre-wrap; font-size: 14px; max-height: 320px; overflow: auto; background: #faf9f6; padding: 8px 10px; border-radius: 6px; }
  .item > button { margin-top: auto; }
  .item.sel > button { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .missing { font-size: 12px; color: var(--accent); }

  .generate { margin-top: 22px; padding: 14px 16px; border: 2px solid var(--accent); border-radius: 10px; background: #fffafa; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .generate .sum { font-size: 14px; flex: 1 1 260px; }
  .generate .sum ol { margin: 4px 0 0; padding-left: 1.4em; }
  .music { margin-top: 22px; }
  .music h3 { font-size: 16px; margin: 0 0 10px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .music h3 small { font-weight: 400; color: var(--ink-soft); font-size: 13px; }
  .tracks { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .track { border: 2px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
  .track.sel { border-color: var(--accent); background: #fffafa; }
  .track .tname { font-weight: 700; font-size: 15px; word-break: break-all; }
  .track audio { width: 100%; height: 36px; }
  .track button { align-self: flex-start; font-size: 14px; padding: 4px 12px; }
  .track.sel button { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .finish { margin-top: 24px; padding-top: 16px; border-top: 1px dashed var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .final-files { font-size: 14px; }
  .final-files code { background: #f1f0ec; padding: 1px 6px; border-radius: 4px; }

  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; cursor: zoom-out; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; }

  .howto { font-size: 14px; color: var(--ink-soft); margin: 0; padding-left: 1.4em; }
  .setup { text-align: center; padding: 40px 20px; }
  .setup p { color: var(--ink-soft); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ALCOHOLIDAY AI部署 管理ページ<small>社長 → 管理者KAYO → design／scripts／editing</small></h1>
    <div class="folder">
      <span id="folderStatus">フォルダ未設定</span>
      <button id="pickBtn">フォルダを選ぶ</button>
      <button id="reloadBtn" disabled>最新にする</button>
      <span id="musicStatus">🎵 音楽フォルダ未設定</span>
      <button id="musicBtn">音楽フォルダを選ぶ</button>
    </div>
  </header>

  <div id="setup" class="box setup" style="display:none">
    <h2 id="setupTitle">はじめに</h2>
    <p id="setupText">「フォルダを選ぶ」を押して、<b>08_AI部署</b> フォルダを選んでください。<br>（Chrome か Edge で開いてください）</p>
    <button class="primary" id="setupBtn">フォルダを選ぶ</button>
  </div>

  <div id="main" style="display:none">
    <section class="box">
      <h2>新しい指示</h2>
      <label class="lbl">どのポスター？ <span>（いくつでも選べます）</span></label>
      <div class="products" id="productPick"></div>

      <label class="lbl" for="imageText">ポスターのイメージ <span>（部屋・時間帯・季節・雰囲気など、思いつくまま）</span></label>
      <textarea id="imageText" rows="4" placeholder="例）雨の夜、窓辺のテーブル。しっとり大人っぽく。ワイン好きが思わず欲しくなる感じ。"></textarea>

      <label class="lbl" for="noteText">補足メモ <span>（なくてもOK）</span></label>
      <textarea id="noteText" rows="2" placeholder="例）文字はおしゃれに少なめ。秋らしく。"></textarea>

      <div class="row-end">
        <span class="msg" id="formMsg"></span>
        <button class="primary" id="submitBtn">KAYOに指示を出す</button>
      </div>
      <ol class="howto">
        <li>指示を出すと、開いている Claude Code に自動で届きます（届かないときは「<b>KAYO、新しい指示を確認して</b>」と話しかけてください）。</li>
        <li>成果物がそろったら、下の一覧で見比べて「これを選ぶ」を押してください。</li>
      </ol>
    </section>

    <section>
      <div class="tabs" id="tabs">
        <button data-f="active" class="on">進行中</button>
        <button data-f="done">完成・投稿済み</button>
        <button data-f="all">すべて</button>
      </div>
      <div id="orders"></div>
    </section>
  </div>
</div>

<div class="lightbox" id="lightbox"><img alt=""></div>

<script>
const PRODUCTS = {
  wine:      { name: "ワイン",         color: "#fff000", file: "wine.jpg" },
  whisky:    { name: "ウイスキー",     color: "#e6c9a8", file: "whisky.jpg" },
  beer:      { name: "ビール",         color: "#8fd3f0", file: "beer.jpg" },
  sake:      { name: "日本酒",         color: "#dcdddc", file: "sake.png" },
  sparkling: { name: "スパークリング", color: "#e5332a", file: "sparkling.png" },
};
const STATUS = [
  ["new", "受付"],
  ["dispatched", "各部署へ指示済み"],
  ["working", "制作中"],
  ["review", "確認待ち"],
  ["video_requested", "動画づくり依頼"],
  ["finish_requested", "仕上げ依頼"],
  ["done", "完成"],
  ["posted", "投稿済み"],
];
const STATUS_NAME = { ...Object.fromEntries(STATUS), dropped: "没" };
const DEPTS = [
  ["design",  "design",  "部屋に飾った写真"],
  ["scripts", "scripts", "構成・画面の文字・投稿文"],
  ["editing", "editing", "完成動画"],
];

// ---- フォルダの記憶（インボックスツールと同じ仕組み） ----
const DB_NAME = "alcoholiday-ai-dept", STORE = "handles", KEY = "root";
function openDb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function saveHandle(h, key = KEY) {
  const db = await openDb();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).put(h, key);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}
async function loadHandle(key = KEY) {
  const db = await openDb();
  return new Promise((res, rej) => {
    const r = db.transaction(STORE, "readonly").objectStore(STORE).get(key);
    r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error);
  });
}

// ---- 音楽フォルダ（C:\Users\abetk\Desktop\ALCOHOLIDAY\音声\backmusic） ----
const MUSIC_KEY = "music";
const MUSIC_DIR = "C:\\Users\\abetk\\Desktop\\ALCOHOLIDAY\\音声\\backmusic";
let musicRoot = null;
let musicHandle = null;
let tracks = [];

async function loadTracks() {
  tracks = [];
  if (!musicRoot) return;
  for await (const [name, h] of musicRoot.entries()) {
    if (h.kind === "file" && /\.(mp3|wav|m4a|aac|ogg)$/i.test(name)) tracks.push(name);
  }
  tracks.sort((a, b) => a.localeCompare(b, "ja"));
}

async function startMusic(h) {
  const perm = await h.requestPermission({ mode: "read" });
  if (perm !== "granted") { showMusicNeedsPermission(h); return; }
  musicRoot = h;
  $("musicStatus").textContent = "🎵 " + h.name;
  $("musicBtn").textContent = "音楽フォルダを変える";
  $("musicBtn").onclick = pickMusic;
  await loadTracks();
  if (root) render();
}

async function pickMusic() {
  try {
    const h = await window.showDirectoryPicker({ mode: "read", id: "music" });
    await saveHandle(h, MUSIC_KEY);
    await startMusic(h);
  } catch (e) {
    if (e.name !== "AbortError") alert("音楽フォルダを開けませんでした：" + e.message);
  }
}

function showMusicNeedsPermission(h) {
  musicHandle = h;
  $("musicStatus").textContent = "🎵 " + h.name + "（許可が必要）";
  $("musicBtn").textContent = "音楽フォルダを許可";
  $("musicBtn").onclick = () => startMusic(h);
}

let root = null;
let board = { orders: [] };
let boardText = "";
let filter = "active";
const urlCache = new Map();

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function getFileByPath(path, create = false) {
  const parts = path.split("/").filter(Boolean);
  let dir = root;
  for (const p of parts.slice(0, -1)) dir = await dir.getDirectoryHandle(p, { create });
  return dir.getFileHandle(parts[parts.length - 1], { create });
}

async function readBoard() {
  try {
    const f = await (await getFileByPath("data/board.json")).getFile();
    const text = await f.text();
    const data = JSON.parse(text.replace(/^﻿/, ""));
    if (!Array.isArray(data.orders)) data.orders = [];
    return { data, text };
  } catch (e) {
    if (e.name === "NotFoundError") return { data: { orders: [] }, text: "" };
    throw e;
  }
}

async function writeBoard(data) {
  const fh = await getFileByPath("data/board.json", true);
  const w = await fh.createWritable();
  const text = JSON.stringify(data, null, 2) + "\n";
  await w.write(text);
  await w.close();
  board = data; boardText = text;
}

// 書き込む直前に必ず最新を読み直す（KAYOの書き込みを消さないため）
async function updateOrder(id, fn) {
  const { data } = await readBoard();
  const o = data.orders.find((x) => x.id === id);
  if (!o) { alert("この指示が見つかりませんでした。「最新にする」を押してください。"); return; }
  fn(o);
  await writeBoard(data);
  render();
}

function nowIso() {
  const d = new Date(), z = -d.getTimezoneOffset(), pad = (n) => String(Math.abs(n)).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}${z >= 0 ? "+" : "-"}${pad(z / 60 | 0)}:${pad(z % 60)}`;
}
function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return isNaN(d) ? iso : `${d.getMonth() + 1}月${d.getDate()}日 ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

// ---- 画面の組み立て ----
function renderProducts() {
  $("productPick").innerHTML = Object.entries(PRODUCTS).map(([k, p], i) =>
    `<label><input type="checkbox" name="product" value="${k}"><span><i style="background:${p.color}"></i>${p.name}</span></label>`
  ).join("");
}

function stepsHtml(status) {
  const idx = STATUS.findIndex(([k]) => k === status);
  return `<ol class="steps">${STATUS.map(([k, n], i) =>
    `<li class="${i < idx ? "past" : i === idx ? "now" : ""}">${n}</li>`).join("")}</ol>`;
}

function itemHtml(o, dept, it) {
  const sel = o.selected && o.selected[dept] === it.id;
  let media = "";
  const files = it.files || (it.file ? [it.file] : []);
  if (dept === "scripts") {
    media = `<div class="script">${esc(it.text || "")}</div>`;
    if (files.length) media += files.map((f) => `<div class="memo">📄 ${esc(f)}</div>`).join("");
  } else if (dept === "editing") {
    media = files.map((f) => `<video controls preload="metadata" data-src="${esc(f)}"></video>`).join("");
  } else {
    const use = (o.selected && o.selected.designFiles) || [];
    media = `<div class="thumbs">${files.map((f, i) => {
      const on = use.includes(f);
      const n = on ? `${use.indexOf(f) + 1}番目` : "";
      return `<div class="shot ${on ? "use" : ""}">
        <img alt="${esc(it.title || "")} 角度${i + 1}" data-src="${esc(f)}">
        <div class="cap">角度${i + 1}</div>
        <button data-act="shot" data-order="${esc(o.id)}" data-item="${esc(it.id)}" data-file="${esc(f)}">${on ? "✓ " + n + "に使う" : "動画に使う"}</button>
      </div>`;
    }).join("")}</div>`;
  }
  return `<div class="item ${sel ? "sel" : ""}">
    <div class="title">${esc(it.title || it.id)}</div>
    ${media}
    ${it.memo ? `<div class="memo">${esc(it.memo)}</div>` : ""}
    <button data-act="select" data-order="${esc(o.id)}" data-dept="${dept}" data-item="${esc(it.id)}">${sel ? "✓ 選択中" : "これを選ぶ"}</button>
  </div>`;
}

function shotName(o, f) {
  for (const it of ((o.deliverables || {}).design || [])) {
    const i = (it.files || []).indexOf(f);
    if (i >= 0) return `${it.title || it.id} の 角度${i + 1}`;
  }
  return f.split("/").pop();
}

function orderHtml(o) {
  const keys = Array.isArray(o.products) && o.products.length ? o.products : (o.product ? [o.product] : []);
  const ps = keys.map((k) => PRODUCTS[k] || { name: k, color: "#ccc" });
  if (!ps.length) ps.push({ name: "（商品未指定）", color: "#ccc" });
  const k = o.kayo || {};
  const d = o.deliverables || {};
  const kayoParts = [["全体", k.summary], ["design へ", k.design], ["scripts へ", k.scripts], ["editing へ", k.editing]].filter(([, v]) => v);

  const depts = DEPTS.map(([key, label, desc]) => {
    const list = d[key] || [];
    return `<div class="dept">
      <h3>${label}<small>${desc}</small></h3>
      ${key === "design" && list.length ? `<p class="hint">写真を押すと大きく見られます。動画に使う角度を、使いたい順に「動画に使う」で選んでください。</p>` : ""}
      ${list.length ? `<div class="items ${key === "scripts" ? "text" : key === "design" ? "wide" : ""}">${list.map((it) => itemHtml(o, key, it)).join("")}</div>`
                    : `<div class="empty">まだ届いていません</div>`}
    </div>`;
  }).join("");

  const s = o.selected || {};
  const vFiles = s.designFiles || [];
  const scriptItem = ((o.deliverables || {}).scripts || []).find((x) => x.id === s.scripts);
  const lockedGen = ["video_requested", "finish_requested", "done", "posted"].includes(o.status);
  const music = s.music || null;
  const canGen = vFiles.length > 0 && !!scriptItem && !!music && !lockedGen;
  const cost = (vFiles.length * 0.18).toFixed(2);
  let musicArea = "";
  if (!lockedGen) {
    let body;
    if (!musicRoot) {
      body = `<div class="empty">上の「音楽フォルダを選ぶ」（または「音楽フォルダを許可」）を押して、<b>backmusic</b> フォルダを選んでください。</div>`;
    } else if (!tracks.length) {
      body = `<div class="empty">音楽フォルダに曲が見つかりません。</div>`;
    } else {
      body = `<div class="tracks">${tracks.map((t) => {
        const on = music === t;
        return `<div class="track ${on ? "sel" : ""}">
          <div class="tname">${esc(t.replace(/\.[^.]+$/, ""))}</div>
          <audio controls preload="none" data-music="${esc(t)}"></audio>
          <button data-act="music" data-order="${esc(o.id)}" data-track="${esc(t)}">${on ? "✓ この曲を使う" : "この曲を使う"}</button>
        </div>`;
      }).join("")}</div>`;
    }
    musicArea = `<div class="music">
      <h3>音楽<small>動画に流す曲を1つ選んでください（▶で試し聞きできます）</small></h3>
      ${music && !tracks.includes(music) && musicRoot ? `<p class="missing">選んでいた曲「${esc(music)}」がフォルダに見つかりません。</p>` : ""}
      ${body}
    </div>`;
  }
  let genArea = "";
  if (o.status === "video_requested") {
    genArea = `<div class="generate"><span class="msg">動画づくりを依頼中です。KAYO に自動で届き、editing が作業します（届かないときは「<b>KAYO、動画をつくって</b>」と話しかけてください）。${music ? `<br>音楽：${esc(music)}` : ""}</span></div>`;
  } else if (!["finish_requested", "done", "posted"].includes(o.status)) {
    genArea = `<div class="generate">
      <div class="sum">${vFiles.length ? `動画に使う写真（この順につなぎます）：<ol>${vFiles.map((f) => `<li>${esc(shotName(o, f))}</li>`).join("")}</ol>` : "動画に使う写真が、まだ選ばれていません。"}
        <div>台本：${scriptItem ? esc(scriptItem.title) : "まだ選ばれていません"}</div>
        <div>音楽：${music ? esc(music.replace(/\.[^.]+$/, "")) : "まだ選ばれていません"}</div>
        ${canGen ? `<div>費用の目安：約 ${cost} ドル（1本 約0.18ドル × ${vFiles.length}本）</div>` : ""}</div>
      <button class="primary" data-act="generate" data-order="${esc(o.id)}" data-cost="${cost}" data-n="${vFiles.length}" ${canGen ? "" : "disabled"}>動画をつくる</button>
    </div>`;
  }
  const canFinish = !!s.editing && !["finish_requested", "done", "posted"].includes(o.status);
  const final = o.final || {};
  let finishArea = "";
  if (o.status === "finish_requested") {
    finishArea = `<span class="msg">仕上げを依頼中です。KAYO に自動で届きます（届かないときは「<b>KAYO、仕上げて</b>」と話しかけてください）。</span>`;
  } else if (o.status === "done" || o.status === "posted") {
    const files = (final.files || []).map((f) => `<code>${esc(f)}</code>`).join(" ");
    finishArea = `<div class="final-files">SNS投稿用セット：${files || "（ファイル未登録）"}${final.memo ? `<br>${esc(final.memo)}` : ""}</div>
      ${o.status === "done" ? `<button data-act="posted" data-order="${esc(o.id)}">投稿済みにする</button>` : ""}`;
  } else {
    finishArea = `<button class="primary" data-act="finish" data-order="${esc(o.id)}" ${canFinish ? "" : "disabled"}>SNS用に仕上げて</button>
      <span class="msg">${canFinish ? "選んだ動画と台本で、投稿用のセットを作ります。" : "完成動画を1つ選ぶと押せます。"}</span>`;
  }

  return `<article class="order">
    <div class="order-head">
      ${ps.map((p) => `<i style="width:14px;height:14px;border-radius:50%;background:${p.color};border:1px solid rgba(0,0,0,.15)"></i>`).join("")}
      <span class="pname">${ps.map((p) => esc(p.name)).join("・")}</span>
      <span class="oid">No.${esc(o.id)}　${fmtDate(o.createdAt)}</span>
      <span class="badge ${esc(o.status)}">${esc(STATUS_NAME[o.status] || o.status)}</span>
    </div>
    <div class="order-body">
      ${stepsHtml(o.status)}
      <div class="brief">${esc(o.image)}${o.note ? `\n\n補足：${esc(o.note)}` : ""}</div>
      ${kayoParts.length ? `<details class="kayo"><summary>KAYO から各部署への指示を見る</summary><dl>${kayoParts.map(([n, v]) => `<dt>${n}</dt><dd>${esc(v)}</dd>`).join("")}</dl></details>`
                         : `<p class="empty" style="margin:10px 0 0">KAYO はまだ指示を読んでいません。</p>`}
      ${depts}
      ${musicArea}
      ${genArea}
      <div class="finish">${finishArea}</div>
    </div>
  </article>`;
}

function render() {
  const orders = [...board.orders].sort((a, b) => String(b.id).localeCompare(String(a.id)));
  const shown = orders.filter((o) => o.status !== "dropped").filter((o) =>
    filter === "all" ? true : filter === "done" ? ["done", "posted"].includes(o.status) : !["done", "posted"].includes(o.status));
  $("orders").innerHTML = shown.length ? shown.map(orderHtml).join("")
    : `<div class="box" style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;color:var(--ink-soft)">ここに表示する指示はありません。</div>`;
  loadMedia();
}

async function loadMedia() {
  for (const el of document.querySelectorAll("[data-src]")) {
    const path = el.dataset.src;
    try {
      const file = await (await getFileByPath(path)).getFile();
      const key = path + "|" + file.lastModified + "|" + file.size;
      if (!urlCache.has(key)) urlCache.set(key, URL.createObjectURL(file));
      el.src = urlCache.get(key);
    } catch {
      el.insertAdjacentHTML("afterend", `<div class="missing">ファイルが見つかりません：${esc(path)}</div>`);
      el.remove();
    }
  }
  if (!musicRoot) return;
  for (const el of document.querySelectorAll("audio[data-music]")) {
    try {
      const file = await (await musicRoot.getFileHandle(el.dataset.music)).getFile();
      const key = "music|" + el.dataset.music + "|" + file.lastModified + "|" + file.size;
      if (!urlCache.has(key)) urlCache.set(key, URL.createObjectURL(file));
      el.src = urlCache.get(key);
    } catch {
      el.insertAdjacentHTML("afterend", `<div class="missing">曲が読めません</div>`);
    }
  }
}

// 1曲を再生したら、ほかの曲は止める
document.addEventListener("play", (e) => {
  if (e.target.tagName !== "AUDIO") return;
  for (const a of document.querySelectorAll("audio")) if (a !== e.target) a.pause();
}, true);

async function refresh(force = false) {
  if (!root) return;
  const { data, text } = await readBoard();
  if (force || text !== boardText) {
    board = data; boardText = text;
    render();
  }
}

// ---- フォルダ設定 ----
async function pickFolder() {
  try {
    const h = await window.showDirectoryPicker({ mode: "readwrite" });
    await saveHandle(h);
    await start(h);
  } catch (e) {
    if (e.name !== "AbortError") alert("フォルダを開けませんでした：" + e.message);
  }
}

async function start(h) {
  const perm = await h.requestPermission({ mode: "readwrite" });
  if (perm !== "granted") { showSetup(h); return; }
  // ひとつ上のフォルダ（AIアルコホリディ）が選ばれたときは、中の 08_AI部署 を使う
  if (h.name !== "08_AI部署") {
    try {
      h = await h.getDirectoryHandle("08_AI部署");
      await saveHandle(h);
    } catch (e) {}
  }
  root = h;
  $("folderStatus").textContent = "📁 " + h.name;
  $("reloadBtn").disabled = false;
  $("setup").style.display = "none";
  $("main").style.display = "";
  if (h.name !== "08_AI部署") $("folderStatus").textContent += "（※08_AI部署 を選んでください）";
  await refresh(true);
}

function showSetup(h) {
  $("main").style.display = "none";
  $("setup").style.display = "";
  if (h) {
    $("setupTitle").textContent = "フォルダの使用を許可してください";
    $("setupText").innerHTML = `前回選んだ <b>${esc(h.name)}</b> を使います。下のボタンを押して「許可」してください。`;
    $("setupBtn").textContent = "許可する";
    $("setupBtn").onclick = () => start(h);
  } else {
    $("setupBtn").onclick = pickFolder;
  }
}

// ---- 操作 ----
$("pickBtn").onclick = pickFolder;
$("reloadBtn").onclick = () => refresh(true);

$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  filter = b.dataset.f;
  for (const x of $("tabs").children) x.classList.toggle("on", x === b);
  render();
});

$("submitBtn").onclick = async () => {
  const products = [...document.querySelectorAll('input[name="product"]:checked')].map((x) => x.value);
  const image = $("imageText").value.trim();
  const note = $("noteText").value.trim();
  if (!products.length) { $("formMsg").textContent = "ポスターを1つ以上選んでください。"; return; }
  if (!image) { $("formMsg").textContent = "ポスターのイメージを書いてください。"; return; }
  $("submitBtn").disabled = true;
  try {
    const { data } = await readBoard();
    const d = new Date();
    const day = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    const n = data.orders.filter((o) => String(o.id).startsWith(day)).length + 1;
    const now = nowIso();
    data.orders.push({
      id: `${day}-${String(n).padStart(2, "0")}`,
      createdAt: now, products, image, note, status: "new",
      kayo: { summary: "", design: "", scripts: "", editing: "" },
      deliverables: { design: [], scripts: [], editing: [] },
      selected: { design: null, scripts: null, editing: null },
      final: { files: [], memo: "" },
      log: [{ at: now, by: "社長", text: "指示を受付" }],
    });
    await writeBoard(data);
    $("imageText").value = ""; $("noteText").value = "";
    document.querySelectorAll('input[name="product"]').forEach((x) => { x.checked = false; });
    $("formMsg").innerHTML = "保存しました。KAYO（Claude Code）に自動で届きます。届かないときは「<b>KAYO、新しい指示を確認して</b>」と話しかけてください。";
    render();
  } catch (e) {
    $("formMsg").textContent = "保存できませんでした：" + e.message;
  } finally {
    $("submitBtn").disabled = false;
  }
};

$("orders").addEventListener("click", async (e) => {
  const img = e.target.closest(".shot img");
  if (img) { $("lightbox").querySelector("img").src = img.src; $("lightbox").classList.add("open"); return; }
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const id = b.dataset.order;
  if (b.dataset.act === "select") {
    const { dept, item } = b.dataset;
    await updateOrder(id, (o) => {
      o.selected = o.selected || {};
      const on = o.selected[dept] !== item;
      o.selected[dept] = on ? item : null;
      (o.log = o.log || []).push({ at: nowIso(), by: "社長", text: `${dept} の ${item} を${on ? "選択" : "選択解除"}` });
    });
  } else if (b.dataset.act === "shot") {
    const { item, file } = b.dataset;
    await updateOrder(id, (o) => {
      o.selected = o.selected || {};
      let use = (o.selected.designFiles || []).filter((f) => f !== file);
      const on = use.length === (o.selected.designFiles || []).length;
      if (on) use.push(file);
      o.selected.designFiles = use;
      if (on) o.selected.design = item;
      (o.log = o.log || []).push({ at: nowIso(), by: "社長", text: `動画に使う写真を${on ? "追加" : "解除"}：${file}` });
    });
  } else if (b.dataset.act === "music") {
    const { track } = b.dataset;
    await updateOrder(id, (o) => {
      o.selected = o.selected || {};
      const on = o.selected.music !== track;
      o.selected.music = on ? track : null;
      o.selected.musicPath = on ? MUSIC_DIR + "\\" + track : null;
      (o.log = o.log || []).push({ at: nowIso(), by: "社長", text: `音楽を${on ? "選択" : "選択解除"}：${track}` });
    });
  } else if (b.dataset.act === "generate") {
    const { cost, n } = b.dataset;
    if (!confirm(`選んだ写真 ${n}枚・台本・音楽で動画をつくります。
Higgsfield の費用は 約 ${cost} ドルです。

よろしいですか？`)) return;
    await updateOrder(id, (o) => {
      const s = o.selected || {};
      o.status = "video_requested";
      o.videoRequest = { at: nowIso(), files: s.designFiles || [], script: s.scripts, music: s.music || null, musicPath: s.musicPath || null, approvedCostUsd: Number(cost) };
      (o.log = o.log || []).push({ at: nowIso(), by: "社長", text: `動画づくりを依頼（写真${n}枚、音楽：${s.music || "なし"}、費用の目安 約${cost}ドルを承認）` });
    });
  } else if (b.dataset.act === "finish") {
    await updateOrder(id, (o) => {
      o.status = "finish_requested";
      (o.log = o.log || []).push({ at: nowIso(), by: "社長", text: "SNS用の仕上げを依頼" });
    });
  } else if (b.dataset.act === "posted") {
    if (!confirm("このセットを「投稿済み」にしますか？")) return;
    await updateOrder(id, (o) => {
      o.status = "posted";
      (o.log = o.log || []).push({ at: nowIso(), by: "社長", text: "投稿済みにした" });
    });
  }
});

$("lightbox").onclick = () => $("lightbox").classList.remove("open");

// 画面に戻ったとき・20秒ごとに、KAYOの更新を自動で読み込む
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
setInterval(() => { if (!document.hidden) refresh().catch(() => {}); }, 20000);

(async () => {
  renderProducts();
  if (!window.showDirectoryPicker) {
    $("setup").style.display = "";
    $("setupText").innerHTML = "このブラウザでは使えません。<b>Chrome か Edge</b> で開いてください。";
    $("setupBtn").style.display = "none";
    $("pickBtn").disabled = true;
    return;
  }
  $("musicBtn").onclick = pickMusic;
  const mh = await loadHandle(MUSIC_KEY).catch(() => null);
  if (mh) {
    if ((await mh.queryPermission({ mode: "read" })) === "granted") await startMusic(mh).catch(() => {});
    else showMusicNeedsPermission(mh);
  }
  const h = await loadHandle().catch(() => null);
  if (h && (await h.queryPermission({ mode: "readwrite" })) === "granted") await start(h);
  else showSetup(h);
})();
</script>
