<!-- 受付サイトの共通の動き（トップページ・受付ページで共通）。Apps Script に HTML ファイル「common」として置く -->
<script>
  // var：トップページから申し込みのページに入れ替えたときに、同じ名前をもう一度使えるように
  var $ = id => document.getElementById(id);
  var PREFS = '北海道,青森県,岩手県,宮城県,秋田県,山形県,福島県,茨城県,栃木県,群馬県,埼玉県,千葉県,東京都,神奈川県,新潟県,富山県,石川県,福井県,山梨県,長野県,岐阜県,静岡県,愛知県,三重県,滋賀県,京都府,大阪府,兵庫県,奈良県,和歌山県,鳥取県,島根県,岡山県,広島県,山口県,徳島県,香川県,愛媛県,高知県,福岡県,佐賀県,長崎県,熊本県,大分県,宮崎県,鹿児島県,沖縄県'.split(',');
  function fillPrefs(sel) {
    PREFS.forEach(p => { const o = document.createElement('option'); o.textContent = p; sel.appendChild(o); });
  }

  // Google 側の関数を呼ぶ（終わるまで待てる形）
  //   Google のページの中で開いたとき：google.script.run で呼ぶ（今までどおり）
  //   AWS に置いた受付ページ（window.ALC_WEB がある）で開いたとき：インターネット経由で GAS の入口（doPost の call）を呼ぶ（2026-10-11）
  var run = (fn, ...args) => (window.google && google.script && google.script.run)
    ? new Promise((ok, ng) => google.script.run.withSuccessHandler(ok).withFailureHandler(ng)[fn](...args))
    : fetch(window.ALC_WEB.api, { method: 'POST', body: JSON.stringify({ action: 'call', fn: fn, args: args }) })
        // 返事が JSON でない（Google のエラーのページなど）ときも、通信が切れたのではないので、中身の文を少しだけ出す（2026-10-31）
        .then(r => r.text().then(t => {
          try { return JSON.parse(t); }
          catch (e) { return { ok: false, error: 'Google からの返事が読めませんでした（' + r.status + '）：' + t.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 150) }; }
        }))
        .then(j => j.ok ? j.result : Promise.reject(Object.assign(new Error(j.error), { server: true })));   // server：GAS が理由をつけて断った（通信は切れていない。2026-10-31）
  var errText = e => String((e && e.message) || e).replace(/^Error:\s*/, '');

  // 別のページへ移る（Google のページは枠の中なので、外側ごと移る）
  function goTo(url) {
    try { window.open(url, '_top'); } catch (e) { /* 下のボタンで移ってもらう */ }
  }

  /* ───── Google でログイン（2026-11-07 タケシの指示：ログインは Google だけ） ─────
     Google のボタンで本人のメールアドレスを確かめ、GAS（googleLogin）で合言葉（session）にかえて、この端末に覚えておく。
     AWS の受付ページ（ad.alcoholiday.org）でだけ使える（Google のページの中では、Google のボタンが動かない） */
  var LOGIN_KEY = 'alc_google';
  function loginNow() {
    try { const v = JSON.parse(localStorage.getItem(LOGIN_KEY) || 'null'); return v && v.session && v.until > Date.now() ? v : null; }
    catch (e) { return null; }
  }
  function logout() {
    try { localStorage.removeItem(LOGIN_KEY); } catch (e) { /* おぼえられない設定のとき */ }
    try { google.accounts.id.disableAutoSelect(); } catch (e) { /* ボタンを読み込む前 */ }
  }
  // boxes の中に Google のボタンを出す。ログインできたら done({ session, email }) を呼ぶ。msg：知らせを出すところ
  function googleButton(boxes, msg, done) {
    if (!DATA.clientId) { msg.textContent = 'ただいま準備中です（Google のログインの設定がまだです）'; return; }
    const draw = () => {
      google.accounts.id.initialize({ client_id: DATA.clientId, ux_mode: 'popup', callback: async r => {
        msg.textContent = 'ログインしています…';
        try {
          const v = await run('googleLogin', r.credential);
          try { localStorage.setItem(LOGIN_KEY, JSON.stringify(v)); } catch (e) { /* おぼえられなくても、このページのあいだは使える */ }
          msg.textContent = '';
          done(v);
        } catch (e) { msg.textContent = errText(e); }
      } });
      boxes.forEach(b => {
        b.innerHTML = '';
        google.accounts.id.renderButton(b, { theme: 'filled_blue', size: 'large', shape: 'pill', text: 'signin_with', locale: 'ja',
          width: Math.max(220, Math.min(b.clientWidth || 320, 400)) });
      });
    };
    if (window.google && google.accounts && google.accounts.id) return draw();
    const sc = document.createElement('script');
    sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true; sc.onload = draw;
    sc.onerror = () => { msg.textContent = 'Google のログインを読み込めませんでした。電波のよい場所で、ページを開き直してください。'; };
    document.head.appendChild(sc);
  }
  var LOGIN_HELP = 'LINE や Instagram の中で開いたときは、Google のログインができないことがあります。そのときは、右上のメニューから Safari か Chrome で開いてください。';

  /* ───── 声で入力（ブラウザの音声認識。使えないときはキーボードのマイクを案内） ───── */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var micNow = null;
  function addMic(field) {
    const target = field.querySelector('input, textarea');
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'mic'; btn.textContent = '🎤 話して入力';
    const msg = document.createElement('div'); msg.className = 'msg';
    const anchor = field.querySelector('.copy') || target;
    anchor.after(btn); btn.after(msg);
    btn.onclick = () => {
      msg.textContent = '';
      if (micNow) { const same = micNow.btn === btn; micNow.rec.stop(); if (same) return; }
      if (!SR) { msg.textContent = 'この画面では声の入力ボタンが使えません。\nスマホのキーボードのマイク🎤のボタンを押して話してください。'; return; }
      const rec = new SR();
      rec.lang = 'ja-JP'; rec.interimResults = true; rec.continuous = true;
      const base = target.value;
      let fixed = '';
      rec.onresult = e => {
        let temp = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) fixed += e.results[i][0].transcript; else temp += e.results[i][0].transcript;
        }
        const max = Number(target.maxLength) > 0 ? Number(target.maxLength) : 10000;
        target.value = (base + fixed + temp).slice(0, max);
        target.dispatchEvent(new Event('input'));
      };
      rec.onerror = e => {
        msg.textContent = e.error === 'not-allowed' || e.error === 'service-not-allowed'
          ? 'マイクが使えませんでした。\nスマホのキーボードのマイク🎤のボタンを押して話してください。'
          : (e.error === 'no-speech' ? '声が聞こえませんでした。もう一度押して話してください。' : '');
      };
      rec.onend = () => { btn.classList.remove('on'); btn.textContent = '🎤 話して入力'; if (micNow && micNow.rec === rec) micNow = null; };
      rec.start();
      micNow = { rec: rec, btn: btn };
      btn.classList.add('on'); btn.textContent = '■ 話しおわったら押す';
    };
  }
  function stopMic() { if (micNow) micNow.rec.stop(); }

  /* ───── 文字数のめやす（あと○文字） ───── */
  function addCount(t) {
    const c = document.createElement('div'); c.className = 'count'; t.after(c);
    const upd = () => { const left = Number(t.dataset.count) - t.value.length; c.textContent = 'あと ' + left + ' 文字'; c.classList.toggle('over', left < 10); };
    t.addEventListener('input', upd); upd();
  }
</script>
