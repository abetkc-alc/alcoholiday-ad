<!-- 受付サイトの共通の動き（トップページ・受付ページで共通）。Apps Script に HTML ファイル「common」として置く -->
<script>
  // var：トップページから申し込みのページに入れ替えたときに、同じ名前をもう一度使えるように
  var $ = id => document.getElementById(id);
  var PREFS = '北海道,青森県,岩手県,宮城県,秋田県,山形県,福島県,茨城県,栃木県,群馬県,埼玉県,千葉県,東京都,神奈川県,新潟県,富山県,石川県,福井県,山梨県,長野県,岐阜県,静岡県,愛知県,三重県,滋賀県,京都府,大阪府,兵庫県,奈良県,和歌山県,鳥取県,島根県,岡山県,広島県,山口県,徳島県,香川県,愛媛県,高知県,福岡県,佐賀県,長崎県,熊本県,大分県,宮崎県,鹿児島県,沖縄県'.split(',');
  function fillPrefs(sel) {
    PREFS.forEach(p => { const o = document.createElement('option'); o.textContent = p; sel.appendChild(o); });
  }

  // Google 側の関数を呼ぶ（終わるまで待てる形）
  var run = (fn, ...args) => new Promise((ok, ng) =>
    google.script.run.withSuccessHandler(ok).withFailureHandler(ng)[fn](...args));
  var errText = e => String((e && e.message) || e).replace(/^Error:\s*/, '');

  // 別のページへ移る（Google のページは枠の中なので、外側ごと移る）
  function goTo(url) {
    try { window.open(url, '_top'); } catch (e) { /* 下のボタンで移ってもらう */ }
  }

  /* ───── 声で入力（ブラウザの音声認識。使えないときはキーボードのマイクを案内） ───── */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var micNow = null;
  function addMic(field) {
    const target = field.querySelector('input, textarea');
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'mic'; btn.textContent = '🎤 話して入力';
    const msg = document.createElement('div'); msg.className = 'msg';
    const anchor = field.querySelector('.copy') || target;
    anchor.after(btn); btn.after(msg);
    btn.onclick = () => {
      msg.textContent = '';
      if (micNow) { const same = micNow.btn === btn; micNow.rec.stop(); if (same) return; }
      if (!SR) { msg.textContent = 'この画面では声の入力ボタンが使えません。\nスマホのキーボードのマイク🎤のボタンを押して話してください。'; return; }
      const rec = new SR();
      rec.lang = 'ja-JP'; rec.interimResults = true; rec.continuous = true;
      const base = target.value;
      let fixed = '';
      rec.onresult = e => {
        let temp = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) fixed += e.results[i][0].transcript; else temp += e.results[i][0].transcript;
        }
        const max = Number(target.maxLength) > 0 ? Number(target.maxLength) : 10000;
        target.value = (base + fixed + temp).slice(0, max);
        target.dispatchEvent(new Event('input'));
      };
      rec.onerror = e => {
        msg.textContent = e.error === 'not-allowed' || e.error === 'service-not-allowed'
          ? 'マイクが使えませんでした。\nスマホのキーボードのマイク🎤のボタンを押して話してください。'
          : (e.error === 'no-speech' ? '声が聞こえませんでした。もう一度押して話してください。' : '');
      };
      rec.onend = () => { btn.classList.remove('on'); btn.textContent = '🎤 話して入力'; if (micNow && micNow.rec === rec) micNow = null; };
      rec.start();
      micNow = { rec: rec, btn: btn };
      btn.classList.add('on'); btn.textContent = '■ 話しおわったら押す';
    };
  }
  function stopMic() { if (micNow) micNow.rec.stop(); }

  /* ───── 文字数のめやす（あと○文字） ───── */
  function addCount(t) {
    const c = document.createElement('div'); c.className = 'count'; t.after(c);
    const upd = () => { const left = Number(t.dataset.count) - t.value.length; c.textContent = 'あと ' + left + ' 文字'; c.classList.toggle('over', left < 10); };
    t.addEventListener('input', upd); upd();
  }

  /* ───── パスワードの「見る」ボタン ───── */
  function addShow(input) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'show'; b.textContent = '見る';
    b.onclick = () => { const hide = input.type === 'password'; input.type = hide ? 'text' : 'password'; b.textContent = hide ? '隠す' : '見る'; };
    input.after(b);
  }
</script>
