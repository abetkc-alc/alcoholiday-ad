<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ホリィ">
<title>ホリィと話す</title>
<!-- 古い iPad（iOS 9 ごろ）でも動くよう、むかしの書き方だけで作っている（let・=>・fetch などは使わない） -->
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #1d1a2e;
    background: -webkit-linear-gradient(top, #2a2340, #120f1e);
    background: linear-gradient(to bottom, #2a2340, #120f1e);
    color: #fff;
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: absolute; top: 0; left: 0; right: 0; bottom: 110px; }
  #bubble {
    position: absolute; top: 3%; left: 6%; right: 6%;
    background: #fff; color: #2a2340;
    border-radius: 28px; padding: 22px 28px;
    font-size: 30px; line-height: 1.5; text-align: center;
    min-height: 45px; max-height: 30%; overflow-y: auto; white-space: pre-wrap;
    -webkit-overflow-scrolling: touch;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  #bubble:after {
    content: ""; position: absolute; bottom: -22px; left: 50%; margin-left: -18px;
    border-width: 24px 18px 0; border-style: solid; border-color: #fff transparent transparent;
  }
  #bubble.thinking { color: #9a93b5; }
  #charbox {
    position: absolute; top: 36%; bottom: 2%; left: 0; right: 0; text-align: center;
  }
  #char {
    height: 100%; width: auto;
    -webkit-animation: bob 3s ease-in-out infinite;
    animation: bob 3s ease-in-out infinite;
  }
  #char.talking { -webkit-animation-duration: .6s; animation-duration: .6s; }
  @-webkit-keyframes bob { 0%,100% { -webkit-transform: translateY(0); } 50% { -webkit-transform: translateY(-10px); } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

  #bar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 110px;
    background: rgba(0,0,0,.35);
  }
  #say {
    position: absolute; left: 20px; right: 330px; top: 20px; height: 70px;
    box-sizing: border-box; -webkit-box-sizing: border-box;
    border: 0; border-radius: 35px; padding: 0 28px;
    font-size: 28px; color: #2a2340; background: #fff;
    -webkit-appearance: none; -webkit-user-select: text;
  }
  .btn {
    position: absolute; top: 20px; height: 70px; border: 0; border-radius: 35px;
    font-size: 28px; font-weight: bold; color: #fff; -webkit-appearance: none;
  }
  #send { right: 130px; width: 180px; background: #f5a623; }
  #send[disabled] { background: #777; }
  #reset { right: 20px; width: 95px; background: #4a4266; font-size: 20px; }
  #hint {
    position: absolute; left: 0; right: 0; bottom: 116px; text-align: center;
    font-size: 18px; color: #b9b2d6;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="bubble">こんにちは！ ホリィだよ。<br>下の白い所をタッチして、キーボードのマイクで話しかけてね。</div>
  <div id="charbox">
    <!-- キャラクター「ホリィ」：頭にレモンをのせたハイボールのグラス -->
    <svg id="char" viewBox="0 0 300 360" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="drink" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffe08a"/>
          <stop offset="1" stop-color="#f5a623"/>
        </linearGradient>
      </defs>
      <ellipse cx="150" cy="345" rx="85" ry="10" fill="#000" opacity=".3"/>
      <!-- グラス -->
      <path d="M62 70 L238 70 L220 322 Q219 335 205 335 L95 335 Q81 335 80 322 Z"
            fill="#ffffff" fill-opacity=".18" stroke="#ffffff" stroke-opacity=".85" stroke-width="5"/>
      <!-- 中身 -->
      <path d="M70 100 L230 100 L215 318 Q214 328 203 328 L97 328 Q86 328 85 318 Z" fill="url(#drink)"/>
      <path d="M70 100 L230 100 L229 112 L71 112 Z" fill="#fff6d8"/>
      <!-- 氷 -->
      <rect x="86" y="96" width="44" height="40" rx="8" fill="#fff" fill-opacity=".55" transform="rotate(-12 108 116)"/>
      <rect x="168" y="94" width="42" height="38" rx="8" fill="#fff" fill-opacity=".5" transform="rotate(10 189 113)"/>
      <!-- 泡 -->
      <circle cx="100" cy="300" r="4" fill="#fff" fill-opacity=".7">
        <animate attributeName="cy" values="310;120" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="205" cy="280" r="3" fill="#fff" fill-opacity=".7">
        <animate attributeName="cy" values="300;125" dur="2.6s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="120" cy="250" r="2.5" fill="#fff" fill-opacity=".7">
        <animate attributeName="cy" values="290;130" dur="2.2s" begin=".5s" repeatCount="indefinite"/>
      </circle>
      <!-- 光 -->
      <path d="M82 120 L95 300" stroke="#fff" stroke-opacity=".5" stroke-width="7" stroke-linecap="round"/>
      <!-- レモン -->
      <g transform="rotate(-18 150 52)">
        <circle cx="150" cy="52" r="36" fill="#ffd400" stroke="#f2b600" stroke-width="5"/>
        <circle cx="150" cy="52" r="27" fill="#fff59a"/>
        <g stroke="#ffd400" stroke-width="3">
          <line x1="150" y1="25" x2="150" y2="79"/>
          <line x1="123" y1="52" x2="177" y2="52"/>
          <line x1="131" y1="33" x2="169" y2="71"/>
          <line x1="169" y1="33" x2="131" y2="71"/>
        </g>
      </g>
      <!-- 目 -->
      <g id="eyesOpen" fill="#2a2340">
        <ellipse cx="120" cy="185" rx="11" ry="15"/>
        <ellipse cx="180" cy="185" rx="11" ry="15"/>
        <circle cx="124" cy="179" r="4" fill="#fff"/>
        <circle cx="184" cy="179" r="4" fill="#fff"/>
      </g>
      <g id="eyesClosed" display="none" fill="none" stroke="#2a2340" stroke-width="5" stroke-linecap="round">
        <path d="M108 187 Q120 195 132 187"/>
        <path d="M168 187 Q180 195 192 187"/>
      </g>
      <!-- ほっぺ -->
      <ellipse cx="98" cy="212" rx="14" ry="8" fill="#ff7a8a" opacity=".6"/>
      <ellipse cx="202" cy="212" rx="14" ry="8" fill="#ff7a8a" opacity=".6"/>
      <!-- 口 -->
      <path id="mouth0" d="M134 214 Q150 228 166 214" fill="none" stroke="#2a2340" stroke-width="5" stroke-linecap="round"/>
      <ellipse id="mouth1" cx="150" cy="219" rx="11" ry="7" fill="#7a2338" display="none"/>
      <g id="mouth2" display="none">
        <ellipse cx="150" cy="222" rx="15" ry="14" fill="#7a2338"/>
        <ellipse cx="150" cy="230" rx="9" ry="5" fill="#ff8a9a"/>
      </g>
      <!-- 蝶ネクタイ -->
      <g fill="#c8102e">
        <path d="M150 262 L122 248 L122 276 Z"/>
        <path d="M150 262 L178 248 L178 276 Z"/>
        <circle cx="150" cy="262" r="7"/>
      </g>
    </svg>
  </div>
</div>
<div id="hint">白い所をタッチ → キーボードの マイク を押して話す → 「話す」</div>
<form id="bar" action="#">
  <input id="say" type="text" placeholder="ここをタッチして話しかける" autocomplete="off" autocorrect="off">
  <button id="send" class="btn" type="submit">話す</button>
  <button id="reset" class="btn" type="button">はじめ<br>から</button>
</form>
<audio id="voice" preload="auto"></audio>

<script>
(function () {
  var bubble = document.getElementById('bubble');
  var ch = document.getElementById('char');
  var say = document.getElementById('say');
  var send = document.getElementById('send');
  var audio = document.getElementById('voice');
  var mouths = [document.getElementById('mouth0'), document.getElementById('mouth1'), document.getElementById('mouth2')];
  var eyesOpen = document.getElementById('eyesOpen');
  var eyesClosed = document.getElementById('eyesClosed');
  var unlocked = false, busy = false, talkTimer = null, lastAudio = '';

  function setMouth(n) {
    for (var i = 0; i < mouths.length; i++) mouths[i].setAttribute('display', i === n ? 'inline' : 'none');
  }

  // 口パク：声が出ているあいだ、口の形をばらばらに変える
  function startTalk() {
    stopTalk();
    ch.setAttribute('class', 'talking');
    var shapes = [0, 1, 2, 1, 2, 2, 1];
    talkTimer = setInterval(function () {
      setMouth(shapes[Math.floor(Math.random() * shapes.length)]);
    }, 110);
  }
  function stopTalk() {
    if (talkTimer) clearInterval(talkTimer);
    talkTimer = null;
    ch.setAttribute('class', '');
    setMouth(0);
  }

  // まばたき
  function blink() {
    eyesOpen.setAttribute('display', 'none');
    eyesClosed.setAttribute('display', 'inline');
    setTimeout(function () {
      eyesOpen.setAttribute('display', 'inline');
      eyesClosed.setAttribute('display', 'none');
    }, 140);
    setTimeout(blink, 2500 + Math.random() * 3000);
  }
  setTimeout(blink, 2000);

  audio.addEventListener('playing', function () { if (audio.src.indexOf('silence') < 0) startTalk(); });
  audio.addEventListener('ended', stopTalk);
  audio.addEventListener('pause', stopTalk);
  audio.addEventListener('error', stopTalk);

  // iPad は「指でさわったとき」しか音を出せないので、最初の送信のときに無音を鳴らして音を出せるようにする
  function unlockAudio() {
    if (unlocked) return;
    unlocked = true;
    audio.src = '/silence.wav';
    try { audio.play(); } catch (e) {}
  }

  function playVoice(url) {
    lastAudio = url;
    audio.src = url;
    audio.load();
    try { audio.play(); } catch (e) {}
  }

  function show(text, thinking) {
    bubble.className = thinking ? 'thinking' : '';
    bubble.textContent = text;
    bubble.scrollTop = 0;
  }

  function post(path, data, done) {
    var x = new XMLHttpRequest();
    x.open('POST', path, true);
    x.setRequestHeader('Content-Type', 'application/json');
    x.timeout = 90000;
    x.onload = function () {
      var r = null;
      try { r = JSON.parse(x.responseText); } catch (e) {}
      done(r);
    };
    x.onerror = x.ontimeout = function () { done(null); };
    x.send(JSON.stringify(data));
  }

  document.getElementById('bar').onsubmit = function (ev) {
    ev.preventDefault();
    var text = say.value.replace(/^\s+|\s+$/g, '');
    if (!text || busy) return false;
    unlockAudio();
    busy = true;
    send.disabled = true;
    say.value = '';
    say.blur();
    show('「' + text + '」\nうーん、考え中…', true);
    post('/api/chat', { text: text }, function (r) {
      busy = false;
      send.disabled = false;
      if (!r) {
        show('パソコンとつながらないみたい。パソコンのプログラムが動いているか見てね。');
        return;
      }
      show(r.reply);
      if (r.audio) {
        playVoice(r.audio);
      } else {
        // 声がないときは、文字の長さのぶんだけ口を動かす
        startTalk();
        setTimeout(stopTalk, Math.min(8000, r.reply.length * 120));
      }
    });
    return false;
  };

  // 吹き出しをタッチすると、もう一度言ってくれる
  bubble.onclick = function () {
    if (lastAudio && !busy) playVoice(lastAudio);
  };

  document.getElementById('reset').onclick = function () {
    if (busy) return;
    post('/api/reset', {}, function () {
      lastAudio = '';
      show('はじめからにしたよ。また話しかけてね！');
    });
  };

  var x = new XMLHttpRequest();
  x.open('GET', '/api/config', true);
  x.onload = function () {
    try {
      var name = JSON.parse(x.responseText).name;
      if (name) document.title = name + 'と話す';
    } catch (e) {}
  };
  x.send();
})();
</script>
</body>
</html>
